name: Deploy ASPX to Azure Web App - test-dashboard-app-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B2E6790EED404D709E7B401100D11DA5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_94B7B19A7343430DBABD912FBB6DC4B4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4DBB29F71D6E4D0AB04BD3FFCBE944D9 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'test-dashboard-app-service'
          slot-name: 'Production'
          package: .
