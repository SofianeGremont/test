# Déploiement ASPX sur Azure Web App - test-dashboard-app-service

name: Deploy ASPX to Azure Web App - test-dashboard-app-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BFA8C8C9E10D41CCA0F3E0F82740B3A6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8FA44A461CD347708D817E5DCE95D9E6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F470972601DE47BCB9DA42A70F49B250 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'test-dashboard-app-service'
          slot-name: 'Production'
          package: .
          
