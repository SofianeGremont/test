# Déploiement ASPX sur Azure Web App - test-dashboard-app-service

name: Deploy ASPX to Azure Web App - test-dashboard-app-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C17B1D07F0284A45828C82FE9161D444 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9744E5E333C64D18ACA62F1EB6B961C9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E8E82FE7D8DD48AF97E874D1A41B252A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'test-dashboard-app-service'
          slot-name: 'Production'
          package: .
